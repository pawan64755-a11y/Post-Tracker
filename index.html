<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पोस्ट ट्रैकर</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#2f7d5b;--warn:#c2410c;--bd:#e4e0d6}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--tx:#f1efe8;--mut:#a09d94;--ac:#4cb68a;--warn:#fb923c;--bd:#33332f}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--tx:#f1efe8;--mut:#a09d94;--ac:#4cb68a;--warn:#fb923c;--bd:#33332f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Segoe UI",sans-serif;line-height:1.45}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.ban{border-radius:14px;padding:14px;margin-bottom:14px;font-weight:600}
.ban.ok{background:var(--ac);color:#fff}.ban.pend{background:var(--card);border:2px solid var(--warn)}
.ban small{display:block;font-weight:400;opacity:.9;margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.t{font-weight:700;font-size:17px}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.st{display:flex;gap:8px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.st b{color:var(--tx)}
.card.over{border:2px solid #dc2626}.redl{color:#dc2626;font-weight:700;font-size:13px;border-top:3px solid #dc2626;padding-top:6px;margin:4px 0}.limok{font-size:13px;color:var(--mut)}
.late{color:var(--warn);font-weight:600;font-size:13px;margin-top:6px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.acts{display:flex;gap:8px;margin-top:10px}.acts .big{flex:1;font-size:16px;padding:12px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
h2{font-size:16px;margin:18px 0 8px}
.td{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.td input[type=checkbox]{width:22px;height:22px;flex:none}
.td.d span{text-decoration:line-through;color:var(--mut)}.td span{flex:1}
.set{display:grid;grid-template-columns:1fr 56px 56px 56px;gap:6px;align-items:center;font-size:13px;margin-bottom:6px}
.hist{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
var KEY='postTrackerV1';
var DEF={start:null,tasks:[
{id:'en',name:'📝 English Blog',total:20,days:10},
{id:'hi',name:'📝 हिंदी Blog',total:10,days:10}],log:{},todos:[]};
function clean(o){o.tasks=(o.tasks||[]).filter(function(t){return t.id!='re'});if(o.q)delete o.q.re;for(var d in o.log)delete o.log[d].re;o.hist=(o.hist||[]).filter(function(h){return h.id!='re'});return o}
var S=clean(load());S.q=S.q||{};S.hist=S.hist||[];S.todos=S.todos||[];S.tasks.forEach(function(t){if(!t.cap)t.cap=t.id=='en'?20:10});
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ds(d){return d.toLocaleDateString('en-CA')}
function today(){return ds(new Date())}
if(!S.start){S.start=today();save()}
function elapsed(){return Math.max(0,Math.round((new Date(today())-new Date(S.start))/864e5))}
function rawOn(id,d){return (S.log[d]&&S.log[d][id])||0}
function capOf(id){var t=S.tasks.filter(function(x){return x.id==id})[0];return t&&t.cap?t.cap:1e9}
function doneOn(id,d){return Math.min(rawOn(id,d),capOf(id))}
function doneAll(id){var n=0;for(var d in S.log)n+=S.log[d][id]||0;return n}
function calc(t){
 var all=doneAll(t.id),td=doneOn(t.id,today()),before=all-td;
 var remStart=Math.max(0,t.total-before),left=t.days-elapsed();
 var late=left<=0&&all<t.total;
 var quota=Math.min(capOf(t.id),Math.ceil(remStart/Math.max(1,left)));
 return{raw:rawOn(t.id,today()),cap:capOf(t.id),all:all,td:td,rem:Math.max(0,t.total-all),quota:quota,todayLeft:Math.max(0,Math.min(quota-td,t.total-all)),late:late,daysLeft:Math.max(0,left)}
}
function act(id,ty){var d=today();S.log[d]=S.log[d]||{};
 if(ty=='l'){if(!(S.q[id]>0))return;S.q[id]--}
 else{var ov=rawOn(id,d)>=capOf(id);S.log[d][id]=rawOn(id,d)+1;if(ty=='s'&&!ov)S.q[id]=(S.q[id]||0)+1}
 S.hist.push({d:d,id:id,ty:ty,ov:ov});if(S.hist.length>300)S.hist.shift();save();render()}
function undo(id){for(var i=S.hist.length-1;i>=0;i--){var h=S.hist[i];if(h.id==id){S.hist.splice(i,1);
 if(h.ty=='l')S.q[id]=(S.q[id]||0)+1;else{S.log[h.d]=S.log[h.d]||{};S.log[h.d][id]=Math.max(0,rawOn(id,h.d)-1);if(h.ty=='s'&&!h.ov)S.q[id]=Math.max(0,(S.q[id]||0)-1)}
 save();render();return}}}
function bk(){var txt=JSON.stringify(S),name='post-tracker-backup-'+today()+'.json';
 function fb(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
 if(window.claude&&claude.use){claude.use('downloads').then(function(d){if(d)return d.save({filename:name,data:txt});fb()}).catch(function(){})}else fb()}
function rt(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.tasks||!o.log)throw 0;if(!confirm('मौजूदा डेटा की जगह बैकअप लोड करें?'))return;S=clean(o);S.q=S.q||{};S.hist=S.hist||[];S.todos=S.todos||[];save();render()}catch(e){alert('यह सही बैकअप फ़ाइल नहीं है')}};r.readAsText(f)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
 var h='',tot=0,pend=[],cs=S.tasks.map(function(t){var c=calc(t);tot+=c.todayLeft;if(c.todayLeft>0)pend.push(c.todayLeft+' '+t.name.replace(/^\S+\s/,''));return c});
 var openTodos=S.todos.filter(function(x){return!x.done});
 var dt=new Date().toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long'});
 h+='<h1>पोस्ट ट्रैकर</h1><div class="sub">'+dt+' · दिन '+(elapsed()+1)+'</div>';
 if(tot==0&&openTodos.length==0)h+='<div class="ban ok">🎉 आज का सारा काम पूरा!<small>शानदार — कल फिर मिलते हैं।</small></div>';
 else h+='<div class="ban pend">आज बाकी: '+tot+' पोस्ट'+(openTodos.length?' + '+openTodos.length+' पेंडिंग काम':'')+'<small>'+esc(pend.join(' · '))+'</small></div>';
 S.tasks.forEach(function(t,i){var c=cs[i],p=Math.min(100,Math.round(c.all/t.total*100));
  h+='<div class="card'+(c.raw>c.cap?' over':'')+'"><div class="row"><div class="t">'+esc(t.name)+'</div><div><b>'+c.td+'</b>/'+c.cap+'</div></div>'
  +'<div class="bar"><i style="width:'+Math.round(c.td/c.cap*100)+'%"></i></div>'
  +(c.raw>=c.cap?'<div class="limok"><b>✅ आज की लिस्ट फुल ('+c.cap+'/'+c.cap+')</b> — कल नई लिस्ट ज़ीरो से शुरू होगी</div>':'')+(c.raw>c.cap?'<div class="redl">🔴 रोज़ की लिमिट '+c.cap+' पार — '+(c.raw-c.cap)+' ज़्यादा (काउंटडाउन में नहीं जुड़ी)</div>':'')
  +'<div class="st"><span>चक्र: <b>'+c.all+'/'+t.total+'</b></span><span>आज का लक्ष्य: <b>'+c.quota+'</b></span><span>आज किया: <b>'+c.td+'</b></span><span>आज बाकी: <b>'+c.todayLeft+'</b></span><span>कुल बाकी: <b>'+c.rem+'</b></span></div>'
  +(c.late?'<div class="late">⚠️ डेडलाइन निकल गई — '+c.rem+' अभी भी पेंडिंग</div>':(c.rem==0?'<div class="st" style="margin-top:6px"><b>✅ पूरा हो गया</b></div>':'<div class="st" style="margin-top:6px">'+c.daysLeft+' दिन बचे</div>'))
  +'<div class="acts"><button class="big" onclick="act(\''+t.id+'\',\'p\')">'+(c.raw>=c.cap?'➕ और पोस्ट जोड़ें':'✔ पब्लिश की')+'</button><button class="g" onclick="undo(\''+t.id+'\')">↩</button></div></div>'});
 h+='<h2>पेंडिंग / एक्स्ट्रा काम</h2><div class="card">';
 S.todos.forEach(function(x,i){h+='<div class="td'+(x.done?' d':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="tg('+i+')"><span>'+esc(x.t)+'</span><button class="g" onclick="rm('+i+')">✕</button></div>'});
 if(!S.todos.length)h+='<div class="hist">कोई पेंडिंग काम नहीं। जो भी बाकी रखना हो यहाँ जोड़ें — पूरा होने तक रोज़ दिखेगा।</div>';
 h+='<div class="acts"><input id="nt" placeholder="नया काम लिखें…"><button onclick="ad()">जोड़ें</button></div></div>';
 h+='<h2>पिछले 7 दिन</h2><div class="card hist">';
 for(var k=0;k<7;k++){var d=new Date();d.setDate(d.getDate()-k);var key=ds(d),parts=S.tasks.map(function(t){return doneOn(t.id,key)}),sum=parts.reduce(function(a,b){return a+b},0);
  h+='<div class="row" style="padding:3px 0"><span>'+(k==0?'आज':key)+'</span><span>'+parts.join(' / ')+' &nbsp;(<b>'+sum+'</b>)</span></div>'}
 h+='<div style="margin-top:6px">क्रम: '+S.tasks.map(function(t){return esc(t.name.replace(/^\S+\s/,''))}).join(' / ')+'</div></div>';
 h+='<h2>सेटिंग</h2><div class="card"><div class="set hist"><span></span><span>कुल</span><span>दिन</span><span>लिमिट</span></div>';
 S.tasks.forEach(function(t,i){h+='<div class="set"><span>'+esc(t.name)+'</span><input type="number" min="1" value="'+t.total+'" onchange="cf('+i+',\'total\',this.value)"><input type="number" min="1" value="'+t.days+'" onchange="cf('+i+',\'days\',this.value)"><input type="number" min="1" value="'+capOf(t.id)+'" onchange="cf('+i+',\'cap\',this.value)"></div>'});
 h+='<div class="hist" style="margin-top:8px">“लिमिट” = एक दिन में अधिकतम गिनती; उससे ज़्यादा पोस्ट लाल रेखा में दिखेगी पर काउंटडाउन में नहीं जुड़ेगी। “दिन” = शुरुआत से कितने दिन में पूरा करना है। रोज़ का लक्ष्य अपने-आप बदलता है — जो आज बच गया, वो कल के लक्ष्य में जुड़ जाता है।</div>'
 +'<div class="acts"><button class="big" onclick="bk()">⬇ बैकअप डाउनलोड</button><button class="g big" onclick="document.getElementById(\'rf\').click()">⬆ रीस्टोर</button><input type="file" id="rf" accept=".json,application/json" style="display:none" onchange="rt(this)"></div>'
 +'<div class="acts"><button class="g" onclick="rs()">नया चक्र शुरू करें (गिनती रीसेट)</button></div></div>';
 document.getElementById('app').innerHTML=h}
function tg(i){S.todos[i].done=!S.todos[i].done;save();render()}
function rm(i){S.todos.splice(i,1);save();render()}
function ad(){var v=document.getElementById('nt').value.trim();if(v){S.todos.push({t:v,done:false});save();render()}}
function cf(i,k,v){v=parseInt(v);if(v>0){S.tasks[i][k]=v;save();render()}}
function rs(){if(confirm('सारी गिनती रीसेट करें?')){S.log={};S.start=today();save();render()}}
render();
var cd=today();function chk(){if(today()!=cd){cd=today();render()}}
setInterval(chk,30000);document.addEventListener('visibilitychange',chk);
</script>
</body>
</html>
